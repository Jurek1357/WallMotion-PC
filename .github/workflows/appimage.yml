name: AppImage

# Linux packaging: PyInstaller onefile bundle wrapped as AppImage.
# Runs on version tags (attaches the AppImage to the GitHub Release,
# next to the Windows .exe) and manually via workflow_dispatch
# (smoke test without publishing anything).
#
# Renderer tools are bundled into the AppImage so users need no manual
# installs: mpv + feh come from apt, xwinwrap / swww / mpvpaper are built
# from pinned sources, and linuxdeploy collects the shared libraries.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Write version file
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "dev-${GITHUB_SHA::7}" > assets/VERSION
          else
            echo "${GITHUB_REF_NAME}" > assets/VERSION
          fi

      - name: Install Qt runtime + renderer build deps
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6
          mpv feh x11-utils
          libx11-dev pkg-config
          meson ninja-build libmpv-dev libwayland-dev wayland-protocols

      - name: Headless import smoke test
        run: |
          QT_QPA_PLATFORM=offscreen python -c "from wallmotion.platform.linux import describe_session; print(describe_session())"
          QT_QPA_PLATFORM=offscreen python -m pytest tests/test_linux.py -q

      - name: Build xwinwrap (X11 video renderer)
        # ujjwal96/xwinwrap redirects to r00tdaemon - pin the canonical URL.
        run: |
          git clone --depth 1 https://github.com/r00tdaemon/xwinwrap /tmp/xwinwrap
          make -C /tmp/xwinwrap

      - name: Build mpvpaper (Wayland video renderer)
        run: |
          git clone --depth 1 --branch 1.9 https://github.com/GhostNaN/mpvpaper /tmp/mpvpaper
          meson setup /tmp/mpvpaper-build /tmp/mpvpaper --prefix=/usr/local
          ninja -C /tmp/mpvpaper-build
          sudo ninja -C /tmp/mpvpaper-build install

      - name: Install swww (wlroots image daemon)
        # swww is not published on crates.io - build the pinned tag.
        # The repo is a workspace, so both package names are required.
        run: >-
          cargo install --locked
          --git https://github.com/LGFae/swww --tag v0.11.2
          swww swww-daemon

      - name: Build onefile bundle
        run: >-
          python -m PyInstaller --onefile --windowed --name WallMotion
          --add-data "assets:assets" --add-data "locales:locales"
          --noconfirm main.py

      - name: Binary smoke test (--version needs no display)
        run: ./dist/WallMotion --version

      - name: Assemble AppDir with bundled renderers
        run: |
          cp assets/icon.png wallmotion.png
          printf '%s\n' '[Desktop Entry]' 'Name=WallMotion' 'Exec=WallMotion' 'Icon=wallmotion' 'Type=Application' 'Categories=Utility;DesktopSettings;' > WallMotion.desktop
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          ./linuxdeploy --appdir AppDir \
            -e dist/WallMotion \
            -e /usr/bin/mpv -e /usr/bin/feh \
            -e /tmp/xwinwrap/xwinwrap \
            -e /usr/local/bin/mpvpaper \
            -e "$HOME/.cargo/bin/swww" -e "$HOME/.cargo/bin/swww-daemon" \
            -l /usr/lib/x86_64-linux-gnu/libwayland-client.so.0 \
            -d WallMotion.desktop -i wallmotion.png

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir WallMotion-x86_64.AppImage

      - name: Upload AppImage artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WallMotion-x86_64.AppImage
          path: WallMotion-x86_64.AppImage

      - name: Attach AppImage to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: WallMotion-x86_64.AppImage
