[package]
name = "wallmotion-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WallMotion native settings window (egui) over the Rust core"

[[bin]]
name = "wallmotion-settings"
path = "src/main.rs"

[dependencies]
wallmotion-core = { path = "../core" }
wallmotion-win = { path = "../win" }
wallmotion-player = { path = "../player" }
eframe = "0.31"
egui = "0.31"
image = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1"
embed-resource = "2"
