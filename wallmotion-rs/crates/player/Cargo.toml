[package]
name = "wallmotion-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WallMotion video playback: mpv sidecar in our window via --wid, driven over JSON IPC"

[lib]
name = "wallmotion_player"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
wallmotion-win = { path = "../win" }
