name: Rust

on:
  push:
    branches: [main]
    paths: ["wallmotion-rs/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["wallmotion-rs/**"]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wallmotion-rs
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Linux system deps: GUI stack (also fixes the pre-existing
      # ubuntu glib-sys build failure) + libmpv for in-process playback.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev dpkg-dev liblzma-dev
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev
          sudo apt-get install -y libappindicator3-dev || sudo apt-get install -y libayatana-appindicator3-dev
          sudo apt-get install -y libmpv-dev

      # libmpv-2.dll hard-depends on vulkan-1.dll (no delay-load):
      # GPU-less CI runners don't have it, so test binaries die at
      # startup. Runtime-only install, no SDK.
      - name: Install Vulkan runtime (Windows)
        if: matrix.os == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime_only: true

      # MSVC links mpv.lib: generated from the DLL's exports (shinchiro
      # ships only a MinGW import lib). Pinned dev package; bump with mpv.
      - name: Install mpv dev files (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -L --fail -o mpv-dev.7z https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-v3-20261011-git-accb7b2821.7z
          7z x mpv-dev.7z -odeps/mpv-dev include libmpv-2.dll libmpv.dll.a -y
          if (!(Test-Path 'deps/mpv-dev/libmpv-2.dll')) { throw 'DLL missing after extract' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'vswhere found no VS with VC tools' }
          $bindir = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object { "$($_.FullName)\bin\Hostx64\x64" }
          $dumpbin = Join-Path $bindir 'dumpbin.exe'
          if (!(Test-Path $dumpbin)) { throw "dumpbin missing: $dumpbin" }
          $out = & $dumpbin /exports 'deps/mpv-dev/libmpv-2.dll'
          $exports = $out | Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' | ForEach-Object { $_.Matches.Groups[1].Value } | Where-Object { $_ -like 'mpv_*' } | Sort-Object -Unique
          Write-Host "mpv exports found: $($exports.Count)"
          if ($exports.Count -lt 50) { $out | Select-Object -First 25 | Write-Host; throw 'too few mpv exports parsed' }
          @('LIBRARY mpv-2', 'EXPORTS') + $exports | Set-Content mpv.def -Encoding Ascii
          & (Join-Path $bindir 'lib.exe') /def:mpv.def /out:deps/mpv-dev/mpv.lib /machine:x64
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed: $LASTEXITCODE" }
          $lib = Get-Item 'deps/mpv-dev/mpv.lib'
          Write-Host "mpv.lib bytes: $($lib.Length)"
          if ($lib.Length -lt 10000) { throw 'mpv.lib suspiciously small' }

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Test binaries link libmpv: both DLLs must be findable at runtime.
      # (Absolute paths: cargo runs each test with the package dir as cwd,
      # so relative entries would miss. Vulkan layout varies → resolve.)
      - name: Diagnose DLL resolution (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vkdll = Get-ChildItem 'C:\VulkanSDK' -Recurse -Filter 'vulkan-1.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$vkdll) { throw 'vulkan-1.dll not found under C:\VulkanSDK' }
          Write-Host "vulkan-1.dll: $($vkdll.FullName)"
          Write-Host " PWD: $PWD"
          Write-Host " mpv DLL present: $(Test-Path "$PWD\deps\mpv-dev\libmpv-2.dll")"
          cargo build --tests -p wallmotion-mpv
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bindir = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object { "$($_.FullName)\bin\Hostx64\x64" }
          $t = Get-ChildItem 'target\debug\deps\wallmotion_mpv-*.exe' | Select-Object -First 1
          Write-Host " test binary: $($t.FullName)"
          & (Join-Path $bindir 'dumpbin.exe') /dependents $t.FullName | Select-String -Pattern '\.dll' | Select-Object -First 15
          foreach ($d in @('mpv-2.dll', 'vulkan-1.dll')) {
              $found = (& where.exe $d 2>$null | Select-Object -First 1)
              Write-Host " where $($d): $($found)"
          }

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vkdll = Get-ChildItem 'C:\VulkanSDK' -Recurse -Filter 'vulkan-1.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$vkdll) { throw 'vulkan-1.dll not found under C:\VulkanSDK' }
          $env:PATH = "$PWD\deps\mpv-dev;$($vkdll.DirectoryName);$env:PATH"
          cargo test --workspace

      - name: Test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace
