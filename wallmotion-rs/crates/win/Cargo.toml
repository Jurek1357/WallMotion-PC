[package]
name = "wallmotion-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WallMotion Windows render surface: WorkerW discovery and video canvas"

[lib]
name = "wallmotion_win"
path = "src/lib.rs"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
