name: NuitkaTest

# Experimental Nuitka onefile build (fewer AV false positives than
# PyInstaller). Manual runs only: builds the exe, smoke-tests it from
# an unrelated working directory (so relative asset fallbacks cannot
# mask broken bundling), uploads the artifact. Does NOT publish.

on:
  workflow_dispatch:

jobs:
  build-nuitka:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt nuitka zstandard

      - name: Write version file
        run: echo "nuitka-test" > assets\VERSION

      - name: Build onefile with Nuitka
        run: >-
          python -m nuitka --onefile --windows-console-mode=disable
          --output-filename=WallMotion-nuitka.exe
          --windows-icon-from-ico=assets\icon.ico
          --include-data-dir=assets=assets --include-data-dir=locales=locales
          --assume-yes-for-downloads --output-dir=build-nuitka main.py

      - name: Smoke test from foreign cwd
        run: |
          cd $env:TEMP
          & "$env:GITHUB_WORKSPACE\build-nuitka\WallMotion-nuitka.exe" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallMotion-nuitka.exe
          path: build-nuitka/WallMotion-nuitka.exe
