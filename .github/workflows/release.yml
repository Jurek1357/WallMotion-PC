name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Write version file
        run: echo "${GITHUB_REF_NAME}" > assets\VERSION

      - name: Build exe
        run: >-
          python -m PyInstaller --onefile --windowed --name WallMotion
          --icon assets\icon.ico --add-data "assets;assets" --add-data "locales;locales" --noconfirm main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/WallMotion.exe
          generate_release_notes: true
