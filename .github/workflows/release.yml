name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-rs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native settings (release)
        run: cargo build --release -p wallmotion-settings
        working-directory: wallmotion-rs

      - name: Stage exe
        run: Copy-Item wallmotion-rs\target\release\wallmotion-settings.exe WallMotion-Settings.exe

      - name: Upload exe artifact
        uses: actions/upload-artifact@v6
        with:
          name: WallMotion-Settings-exe
          path: WallMotion-Settings.exe

  publish:
    needs: [build-rs]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            The native WallMotion app (beta) — no Python, no installer.
            Needs **mpv on PATH** for video wallpapers. The classic Python
            app stays available in older releases and in the sources.
