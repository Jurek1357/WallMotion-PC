name: AppImage

# Linux packaging: the native Rust settings app (wallmotion-settings) in an
# AppImage. Runs on version tags (attaches the AppImage to the GitHub Release)
# and manually via workflow_dispatch (smoke test without publishing anything).
#
# libmpv, ffmpeg and the GTK runtime are bundled, so the AppImage works
# without distro packages (and without the legacy Python app).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "wallmotion-rs/**"
      - "installer/linux/**"
      - "assets/icon.png"
      - ".github/workflows/appimage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    # Keep this pinned: the runner's glibc is the minimum users need.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev liblzma-dev
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libgtk-3-bin libxdo-dev
          sudo apt-get install -y libgdk-pixbuf-2.0-dev librsvg2-dev libgirepository1.0-dev
          sudo apt-get install -y libappindicator3-dev || sudo apt-get install -y libayatana-appindicator3-dev
          sudo apt-get install -y libmpv-dev ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native settings app
        run: cargo build --release -p wallmotion-settings
        working-directory: wallmotion-rs

      - name: Assemble AppDir + build AppImage
        env:
          DEPLOY_GTK_VERSION: "3"
          OUTPUT: WallMotion-x86_64.AppImage
        run: |
          cp assets/icon.png wallmotion-settings.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -O linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
          EXTRA_LIBS=()
          for lib in /usr/lib/x86_64-linux-gnu/libayatana-appindicator3.so.1 \
                     /usr/lib/x86_64-linux-gnu/libappindicator3.so.1; do
            if [ -e "$lib" ]; then EXTRA_LIBS+=(-l "$lib"); break; fi
          done
          ./linuxdeploy --appdir AppDir \
            -e wallmotion-rs/target/release/wallmotion-settings \
            -e /usr/bin/ffmpeg \
            -l /usr/lib/x86_64-linux-gnu/libmpv.so.2 \
            -l /usr/lib/x86_64-linux-gnu/libxdo.so.3 \
            "${EXTRA_LIBS[@]}" \
            -d installer/linux/wallmotion-settings.desktop \
            -i wallmotion-settings.png \
            --plugin gtk \
            --output appimage

      - name: Smoke test (--version needs no display)
        run: |
          chmod +x WallMotion-x86_64.AppImage
          ./WallMotion-x86_64.AppImage --appimage-extract > /dev/null
          ./squashfs-root/AppRun --version

      - name: Upload AppImage artifact (manual/PR runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: WallMotion-x86_64.AppImage
          path: WallMotion-x86_64.AppImage
          retention-days: 7

      - name: Attach AppImage to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: WallMotion-x86_64.AppImage
