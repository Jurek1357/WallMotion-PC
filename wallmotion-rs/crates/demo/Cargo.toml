[package]
name = "wallmotion-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WallMotion native demo: animated test pattern behind desktop icons"

[[bin]]
name = "wallmotion-demo"
path = "src/main.rs"

[dependencies]
wallmotion-win = { path = "../win" }

[build-dependencies]
embed-manifest = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
